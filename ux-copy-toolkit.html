<!--
  UX Copy Toolkit v3, by Stephanie Schwarz (linkedin.com/in/uxschwarz)

  HOW TO PUBLISH YOUR OWN COPY
  This file contains no API key, token or credentials. When you publish it,
  the Audit and Create features use the Claude account of whoever opens the page.

  1. Open a conversation with Claude where Claude can publish artifacts.
  2. Attach this file (ux-copy-toolkit.html).
  3. Ask Claude: "Publish this file as an artifact without changing the code,
     and declare the sample capability."
  4. Open the published page and run a short test audit. The first time,
     allow the page to use Claude when asked.

  Important
  - The "sample" capability is what lets the page call Claude. Without it,
    the page opens but Audit and Create show as unavailable.
  - Pasting this code into a regular chat artifact and publishing it with the
    Publish button does not work: that format uses a different way to call Claude.
  - Availability of artifact publishing may depend on your Claude plan.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: single reading column, tool panels under a tab bar; amber accent kept from v2, darkened for contrast */
:root{
  --bg:#ffffff;--surface:#ffffff;--sunken:#f3f1ec;--fg:#1c1a17;--muted:#5b5650;--line:#dcd7cf;--line-strong:#8a8278;
  --accent:#a8540a;--accent-fg:#ffffff;--accent-soft:#fbefd9;--accent-ink:#7a3d06;
  --ok:#1d6b3a;--ok-soft:#e3f2e8;--warn:#8a5a00;--warn-soft:#fbf0d4;--bad:#b42318;--bad-soft:#fdebe9;
  --info:#1d4ed8;--info-soft:#e6edfd;--focus:#1d4ed8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
:root,:root[data-theme]{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;padding-block:40px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar-r{display:flex;align-items:center;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.ver{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.01em}
h1 .amp{color:var(--accent);font-weight:600}
.lede{color:var(--muted);margin-top:10px;max-width:60ch}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;margin-top:32px;border-bottom:2px solid var(--fg)}
.tabs [role="tab"]{flex:0 1 auto;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 16px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
@media (max-width:520px){.tabs{gap:0}.tabs [role="tab"]{flex:1 1 auto;padding:10px 8px;font-size:14px}}
.tabs [role="tab"][aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.tabs [role="tab"]:hover{color:var(--fg)}
[role="tabpanel"]{padding-top:28px;display:flex;flex-direction:column;gap:28px}

/* Notices */
.notice{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--fg);padding:12px 14px;border-radius:6px;margin-top:20px}
.inline-warn{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--warn-soft);border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--fg)}
.linkbtn{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.linkbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* About */
.feature-list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.feature-list li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.feature-list strong{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.checks-table{display:grid;margin:0}
.checks-table div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.checks-table dt{font-weight:600}
.checks-table dd{margin:0;color:var(--muted)}
@media (max-width:560px){.checks-table div{grid-template-columns:1fr;gap:2px}}
.caveat{background:var(--sunken);border-radius:8px;padding:14px 16px}
.caveat h3{font-size:16px;margin-bottom:4px}
.section-h{font-size:22px;margin-bottom:12px}

/* Forms */
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted)}
textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6}
textarea{min-height:140px;resize:vertical}
textarea:focus,select:focus{border-color:var(--accent)}
.block{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.block+.block{border-top:1px solid var(--line);padding-top:24px}
.block h2{font-size:20px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt label{display:block;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;height:100%}
.opt label small{display:block;color:var(--muted);font-size:13px}
.opt label b{font-weight:600}
.chips .opt label{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500}
.opt input:checked+label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:checked+label b,.chips .opt input:checked+label{color:var(--accent-ink)}
.opt input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.preset-row button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:500;cursor:pointer}
.preset-row button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Buttons: one primary (filled accent) and one secondary (outlined) style everywhere; same disabled state for both */
.btn{border-radius:6px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.4}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--fg);border-color:var(--line-strong)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{background:var(--sunken);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.state{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.state.on{background:var(--ok-soft);color:var(--ok)}
.state.off{background:var(--sunken);color:var(--muted)}
.statusline{display:flex;flex-wrap:wrap;gap:8px}
.msg{min-height:1.6em;color:var(--muted)}
.msg.err{color:var(--bad);font-weight:500}
.savebar{border-top:1px solid var(--line);padding-top:24px}

/* Results */
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:20px}
.result h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.res-head{display:flex;gap:18px;align-items:center}
.res-head>div{min-width:0}
.ring circle{fill:none;stroke-width:4}
.ring .ring-track{stroke:var(--line)}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--fg)}
.ring.ok .ring-val{stroke:var(--ok)}.ring.warn .ring-val{stroke:var(--warn)}.ring.bad .ring-val{stroke:var(--bad)}
.ring .ring-val{transition:stroke-dashoffset .8s ease-out}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--sunken);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.issue{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.issue.sev-CRITICAL{border-left-color:var(--bad)}.issue.sev-MAJOR{border-left-color:var(--warn)}.issue.sev-MINOR{border-left-color:var(--info)}
.issue .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.issue .type{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.issue .problem{font-weight:600}
.issue .ref{font-size:13px;color:var(--muted)}
.issue .fix{background:var(--ok-soft);border-radius:6px;padding:8px 10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check>div{min-width:0}
.check .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.copybox{background:var(--accent-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.copybox .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.copybox .copy{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.copybox .note{font-size:13px;color:var(--muted)}
.copybox .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mini{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:6px;padding:4px 12px;font-size:14px;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent-ink)}
.tags-flat{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.tags-flat li{background:var(--sunken);border-radius:999px;padding:3px 10px;font-size:13px}
.viol li{background:var(--bad-soft);color:var(--bad)}
.feat li{background:var(--ok-soft);color:var(--ok)}
.tip{background:var(--sunken);border-radius:8px;padding:12px 14px}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;font-weight:600}
footer a:hover{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header>
    <div class="bar">
      <span class="brand" data-i18n="brand"></span>
      <div class="bar-r">
        <div class="seg" role="group" id="langGroup" data-i18n-aria="langLabel">

          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <span class="ver">v3</span>
      </div>
    </div>
    <h1><span data-i18n="h1a"></span> <span class="amp" data-i18n="h1and"></span> <span data-i18n="h1b"></span><br><span data-i18n="h1c"></span></h1>
    <p class="lede" data-i18n="subtitle"></p>
    <div id="aiNotice" class="notice" role="status" hidden></div>
    <div class="tabs" role="tablist" id="tabs" data-i18n-aria="tabsLabel">

  <main>

    <section role="tabpanel" id="panel-about" aria-labelledby="tab-about" tabindex="0">
      <div style="display:flex;flex-direction:column;gap:10px">
        <p data-i18n="aboutIntro" style="font-size:17px"></p>
        <p data-i18n="aboutDesc" style="color:var(--muted)"></p>
      </div>
      <div>
        <h2 class="section-h" data-i18n="aboutFeaturesTitle"></h2>
        <ul class="feature-list" id="aboutFeatures"></ul>

      <div>

        <h3 data-i18n="aboutWarningTitle"></h3>
        <p data-i18n="aboutWarningDesc"></p>
      </div>
      <div><button type="button" class="btn btn-primary" id="aboutCta" data-i18n="aboutCta"></button></div>
    </section>

    <!-- CONFIG -->
    <section role="tabpanel" id="panel-config" aria-labelledby="tab-config" tabindex="0" hidden>
      <p data-i18n="configIntro" style="color:var(--muted)"></p>
      <fieldset class="field" id="modeCfg"></fieldset>

      <div class="block" id="brandBlock">
        <div class="actions" style="justify-content:space-between">
          <h2 data-i18n="brandTitle"></h2>
          <span class="state" id="brandState"></span>
        </div>
        <div class="field">
          <span class="label" id="presetsLbl" data-i18n="presetsLabel"></span>
          <div class="preset-row" id="presets" role="group" aria-labelledby="presetsLbl"></div>
        </div>
        <div class="field">
          <label class="label" for="brandText" data-i18n="brandLabel"></label>
          <textarea id="brandText" style="min-height:200px" data-i18n-ph="brandPh"></textarea>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="brandClear" data-i18n="clear"></button>
        </div>
      </div>

      <div class="block" id="a11yBlock">
        <div class="actions" style="justify-content:space-between">
          <h2 data-i18n="a11yTitle"></h2>
          <span class="state" id="a11yState"></span>
        </div>
        <fieldset class="field">
          <legend class="label" data-i18n="stdLegend"></legend>
          <div class="cards" id="stdCards"></div>
        </fieldset>
        <div class="field">
          <label class="label" for="a11yCustom" data-i18n="customLabel"></label>
          <span class="hint" id="a11yCustomHint" data-i18n="customHint"></span>
          <textarea id="a11yCustom" style="min-height:100px" aria-describedby="a11yCustomHint" data-i18n-ph="customPh"></textarea>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="a11yClear" data-i18n="clear"></button>

      </div>

      <div class="block">
        <h2 data-i18n="outTitle"></h2>
        <div class="field">
          <label class="label" for="outLang" data-i18n="outLabel"></label>
          <select id="outLang" style="max-width:320px">
            <option value="auto" data-i18n="outAuto"></option>
            <option value="pt" data-i18n="outPt"></option>
            <option value="en" data-i18n="outEn"></option>
          </select>
        </div>
      </div>

      <div class="actions savebar">
        <button type="button" class="btn btn-primary" id="saveAll" data-i18n="saveAll"></button>
        <button type="button" class="btn btn-ghost" id="continueBtn" data-goto="audit" data-i18n="continueLbl" disabled></button>
        <p class="msg" id="saveMsg" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- AUDIT -->
    <section role="tabpanel" id="panel-audit" aria-labelledby="tab-audit" tabindex="0" hidden>
      <div class="statusline" id="auditStatus"></div>
      <div class="inline-warn" id="auditWarn" hidden><span data-i18n="needConfig"></span><button type="button" class="linkbtn" data-goto="config" data-i18n="goConfig"></button></div>
      <fieldset class="field">
        <legend class="label" data-i18n="auditTypeLegend"></legend>
        <div class="chips" id="auditTypes"></div>
      </fieldset>
      <div class="field">
        <label class="label" for="auditInput" data-i18n="auditInputLabel"></label>
        <textarea id="auditInput" data-i18n-ph="auditPh"></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="auditRun"></button>
        <button type="button" class="btn btn-ghost" id="auditStop" data-i18n="stop" hidden></button>
        <button type="button" class="btn btn-ghost" id="auditClear" data-i18n="clear"></button>
      </div>
      <p class="msg" id="auditMsg" role="status" aria-live="polite"></p>
      <div id="auditResult"></div>
    </section>

    <!-- GENERATE -->
    <section role="tabpanel" id="panel-generate" aria-labelledby="tab-generate" tabindex="0" hidden>
      <div class="statusline" id="genStatus"></div>
      <div class="inline-warn" id="genWarn" hidden><span data-i18n="needConfig"></span><button type="button" class="linkbtn" data-goto="config" data-i18n="goConfig"></button></div>
      <fieldset class="field">
        <legend class="label" data-i18n="genTypeLegend"></legend>
        <div class="chips" id="genTypes"></div>
      </fieldset>
      <div class="field">
        <label class="label" for="genInput" data-i18n="genInputLabel"></label>
        <textarea id="genInput" style="min-height:100px" data-i18n-ph="genPh"></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="genRun"></button>
        <button type="button" class="btn btn-ghost" id="genStop" data-i18n="stop" hidden></button>
        <button type="button" class="btn btn-ghost" id="genClear" data-i18n="clear"></button>
      </div>
      <p class="msg" id="genMsg" role="status" aria-live="polite"></p>
      <div id="genResult"></div>
    </section>
  </main>

  <footer>
    <span data-i18n="footerTitle" style="font-weight:600;color:var(--fg)"></span> · <span data-i18n="footerDeveloped"></span>
    <a href="https://www.linkedin.com/in/uxschwarz/" target="_blank" rel="noopener noreferrer">Stephanie Schwarz<span class="sr-only" data-i18n="newTab"></span></a><br>
    <span data-i18n="footerDesc"></span>
  </footer>
</div>

(function () {
  "use strict";

  /* ---------- Content ---------- */
  const TYPE_LABELS = {
    en: { error: "Error message", empty: "Empty state", loading: "Loading state", success: "Success/Confirmation", permission: "Permission request", notification: "Notification", onboarding: "Onboarding step", cta: "CTA/Button", modal: "Modal/Dialog", tooltip: "Tooltip/Help", form: "Form labels", link: "Link text", alt: "Alt text", disclosure: "Disclosure/Legal", verification: "Verification step", upgrade: "Upgrade/Paywall", feedback: "Feedback request", authentication: "Authentication flow", transaction: "Transaction confirmation" },
    pt: { error: "Mensagem de erro", empty: "Estado vazio", loading: "Carregamento", success: "Sucesso/Confirmação", permission: "Pedido de permissão", notification: "Notificação", onboarding: "Etapa de integração", cta: "CTA/Botão", modal: "Modal/Diálogo", tooltip: "Dica/Ajuda", form: "Rótulos de formulário", link: "Texto de link", alt: "Texto alternativo", disclosure: "Divulgação/Jurídico", verification: "Etapa de verificação", upgrade: "Atualização/Paywall", feedback: "Pedido de feedback", authentication: "Fluxo de autenticação", transaction: "Confirmação de transação" }
  };
  const BASE_TYPES = ["error", "empty", "loading", "success", "permission", "notification", "onboarding", "cta", "modal", "tooltip"];
  const AUDIT_TYPES = BASE_TYPES.concat(["form", "link", "alt"]);
  const GEN_TYPES = BASE_TYPES.concat(["disclosure", "verification", "upgrade", "feedback", "authentication", "transaction"]);

  const PRESET_LABELS = {
    en: { fintech: "Fintech", healthcare: "Healthcare", saas: "B2B SaaS", ecommerce: "E-commerce", blank: "Start from scratch" },
    pt: { fintech: "Fintech", healthcare: "Saúde", saas: "SaaS B2B", ecommerce: "E-commerce", blank: "Começar do zero" }
  };

      const clean = isAudit ? cleanAudit(raw) : cleanGen(raw);
      if (!clean) { setMsg(which, t().errors.bad_shape, true); return; }
      clean._mode = modeAtRun;
      results[which] = clean;
      isAudit ? renderAudit() : renderGen();
      setMsg(which, isAudit ? t().doneAudit : t().doneGen);
      const hd = document.getElementById(isAudit ? "auditResH" : "genResH");
      if (hd) { hd.closest(".result").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); hd.focus({ preventScroll: true }); }
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") setMsg(which, t().stopped);
      else if (HIDE_CODES.indexOf(code) >= 0) { aiState = "blocked"; setMsg(which, ""); refreshAI(); }
      else setMsg(which, errorText(code), true);
    } finally {
      ctl[which] = null; updateRunState();
    }
  }
  $("#auditRun").addEventListener("click", () => run("audit"));
  $("#genRun").addEventListener("click", () => run("gen"));

  renderAll();
})();
</script>
